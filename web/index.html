<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Библия">
<meta name="theme-color" content="#ffffff">
<title>Библия</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="reader" tabindex="-1">
  <div id="loading">Загрузка…</div>
  <div id="titleRow">
    <h1 id="title"></h1>
    <div id="modeToggles" aria-label="Modes">
      <button type="button" class="modeBtn" id="tolkBtn" data-mode="tolk" data-full="Толкование" data-short="Толк">Толкование</button>
      <button type="button" class="modeBtn" id="simfBtn" data-mode="simf" data-full="Симфония" data-short="Симф">Симфония</button>
      <button type="button" class="modeBtn" id="trBtn" data-mode="en" data-full="English" data-short="Eng">English</button>
    </div>
  </div>
  <div id="text"></div>
  <div id="endnav"></div>
</main>


<nav id="bar">
  <div id="left">
    <button id="menuBtn" aria-label="Меню">☰</button>
    <button id="audioBtn" type="button" aria-label="Слушать">
      <svg class="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      <svg class="icPause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 5h3v14H7zm7 0h3v14h-3z" fill="currentColor"/></svg>
    </button>
    <div id="leftMain">
      <div id="player" hidden>
        <button id="pRef" type="button" hidden aria-label="К текущему аудио"></button>
        <button id="pBack" type="button" aria-label="Назад 15 секунд">↺15</button>
        <input id="pSeek" type="range" min="0" max="1000" value="0" aria-label="Позиция">
        <span id="pTime">0:00</span>
        <button id="pStop" type="button" aria-label="Стоп">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="chNav">
    <button type="button" id="prevCh" aria-label="Предыдущая глава"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 5 8 12 15 19" fill="none" stroke="currentColor" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" id="current"></button>
    <button type="button" id="nextCh" aria-label="Следующая глава"><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 5 16 12 9 19" fill="none" stroke="currentColor" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div id="slots"></div>
</nav>

<div id="sheet" hidden>
  <div id="sheetHead"><button id="sheetBack" hidden data-i="back">‹ Назад</button><span id="sheetTitle"></span><button id="sheetClose" aria-label="Close">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="pop" hidden>
  <div class="lbl">Язык · Language</div>
  <div class="seg" id="langSeg"><button data-l="ru">Русский</button><button data-l="en">English</button></div>
  <div class="lbl" data-i="size">Размер текста</div>
  <div class="size"><span style="font-size:18px">А</span><input id="fsRange" type="range" min="18" max="64" step="2"><span style="font-size:28px">А</span></div>
  <div class="lbl" data-i="theme">Тема</div>
  <div class="seg" id="themeSeg"><button data-t="light" data-i="light">Светлая</button><button data-t="dark" data-i="dark">Тёмная</button><button data-t="system" data-i="auto">Авто</button></div>
  <div class="lbl" data-i="reader">Чтец (аудио)</div>
  <div class="seg" id="readerSeg"><button type="button" data-r="kozlov" data-i="readerKozlov">Козлов</button><button type="button" data-r="efimov" data-i="readerEfimov">Ефимов</button></div>
  <div class="lbl" data-i="trl">Перевод</div>
  <select id="trSel"></select>
  <div class="lbl" data-i="speed">Скорость</div>
  <div class="seg" id="rateSeg"><button data-r="0.9">0.9×</button><button data-r="1">1×</button><button data-r="1.1">1.1×</button><button data-r="1.2">1.2×</button></div>
  <div class="lbl" data-i="sleep">Таймер сна</div>
  <div class="seg" id="sleepSeg"><button data-s="0" data-i="off">Выкл</button><button data-s="15" data-i="m15">15 м</button><button data-s="30" data-i="m30">30 м</button><button data-s="60" data-i="m60">60 м</button><button data-s="-1" data-i="chEnd">Глава</button></div>
  <label class="tog"><span data-i="cont">Продолжать со следующей главы</span><input type="checkbox" id="contChk"></label>
  <label class="tog"><span data-i="follow">Следить за стихом (Козлов)</span><input type="checkbox" id="followChk"></label>
  <label class="tog"><span data-i="adv">Дополнительно</span><input type="checkbox" id="advChk"></label>
  <div id="advPanel" hidden>
  <div class="lbl" id="haLbl">Home Assistant</div>
  <input id="haWebhook" type="url" placeholder="https://…/api/webhook/…" autocomplete="off" spellcheck="false">
  <p class="hint" id="haHint">Пусто = выкл. Нужен HTTPS (Cloudflare Tunnel и т.п.). POST позиции при чтении.</p>
  <button class="link voiceRow" id="voiceBtn" type="button" hidden data-i="voice">🎤 Голосовая команда</button>
  </div>
  <button class="link" id="aboutBtn" data-i="about">О приложении</button>
</div>
<div id="toast" hidden></div>
<audio id="audio" preload="none"></audio>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
