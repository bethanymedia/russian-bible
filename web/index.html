<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Библия">
<meta name="theme-color" content="#ffffff">
<title>Библия</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="reader" tabindex="-1">
  <div id="loading">Загрузка…</div>
  <div id="titleRow">
    <h1 id="title"></h1>
    <div id="modeToggles" aria-label="Modes">
      <button type="button" class="modeBtn" id="tolkBtn" data-mode="tolk" data-short="Толк" data-full="Толкование">Толк</button>
      <button type="button" class="modeBtn" id="simfBtn" data-mode="simf" data-short="Симф" data-full="Симфония">Симф</button>
      <button type="button" class="modeBtn" id="trBtn" data-mode="en" data-short="EN" data-full="English">EN</button>
    </div>
  </div>
  <div id="text"></div>
  <div id="endnav"></div>
</main>


<nav id="bar">
  <div id="left">
    <button id="menuBtn" aria-label="Меню">☰</button>
    <button id="audioBtn" aria-label="Слушать">▶</button>
    <button type="button" id="micBtn" aria-label="Голос" hidden>🎤</button>
    <div id="player" hidden>
      <button id="pBack" aria-label="Назад 15 секунд">↺15</button>
      <input id="pSeek" type="range" min="0" max="1000" value="0" aria-label="Позиция">
      <span id="pTime">0:00</span>
      <button id="pStop" aria-label="Стоп">■</button>
    </div>
  </div>
  <div id="chNav">
    <button type="button" id="prevCh" aria-label="Предыдущая глава">‹</button>
    <button type="button" id="current"></button>
    <button type="button" id="nextCh" aria-label="Следующая глава">›</button>
  </div>
  <div id="slots"></div>
</nav>

<div id="sheet" hidden>
  <div id="sheetHead"><button id="sheetBack" hidden data-i="back">‹ Назад</button><span id="sheetTitle"></span><button id="sheetClose" aria-label="Close">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="pop" hidden>
  <div class="lbl">Язык · Language</div>
  <div class="seg" id="langSeg"><button data-l="ru">Русский</button><button data-l="en">English</button></div>
  <div class="lbl" data-i="size">Размер текста</div>
  <div class="size"><span style="font-size:13px">А</span><input id="fsRange" type="range" min="14" max="40" step="1"><span style="font-size:22px">А</span></div>
  <div class="lbl" data-i="theme">Тема</div>
  <div class="seg" id="themeSeg"><button data-t="light" data-i="light">Светлая</button><button data-t="dark" data-i="dark">Тёмная</button><button data-t="system" data-i="auto">Авто</button></div>
  <div class="lbl" data-i="reader">Чтец (аудио)</div>
  <select id="readerSel"><option value="kozlov">Игорь Козлов</option><option value="efimov">А. Ф. Ефимов</option></select>
  <div class="lbl" data-i="trl">Перевод</div>
  <select id="trSel"></select>
  <div class="lbl" data-i="speed">Скорость</div>
  <div class="seg" id="rateSeg"><button data-r="0.75">0.75×</button><button data-r="1">1×</button><button data-r="1.25">1.25×</button><button data-r="1.5">1.5×</button></div>
  <div class="lbl" data-i="sleep">Таймер сна</div>
  <div class="seg" id="sleepSeg"><button data-s="0" data-i="off">Выкл</button><button data-s="15" data-i="m15">15 м</button><button data-s="30" data-i="m30">30 м</button><button data-s="60" data-i="m60">60 м</button><button data-s="-1" data-i="chEnd">Глава</button></div>
  <label class="tog"><span data-i="cont">Продолжать со следующей главы</span><input type="checkbox" id="contChk"></label>
  <label class="tog"><span data-i="follow">Следить за стихом (Козлов)</span><input type="checkbox" id="followChk"></label>
  <button class="link" id="voiceBtn" type="button" hidden>🎤 Голос · Voice</button>
  <button class="link" id="aboutBtn" data-i="about">О приложении</button>
</div>
<div id="toast" hidden></div>
<audio id="audio" preload="none"></audio>
<script src="voice.js"></script>
<script src="app.js"></script>
</body>
</html>
